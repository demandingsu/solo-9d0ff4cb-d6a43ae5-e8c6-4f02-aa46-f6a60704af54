services:
  notice-site:
    build: ./site
    ports:
      - "8080:8080"
    networks:
      - notice-net

  api:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      # API 通过 Compose 网络访问示例站；站点身份按 协议+主机+端口 归一化
      INTAKE_DB_PATH: /data/intake.db
      MAX_LIST_PAGES: "50"
      MAX_DETAIL_PAGES: "500"
    volumes:
      - intake-data:/data
    depends_on:
      notice-site:
        condition: service_healthy
    networks:
      - notice-net

volumes:
  intake-data:

networks:
  notice-net:
    driver: bridge
